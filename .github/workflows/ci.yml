name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Run test suite
        run: npm test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: whyso:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name whyso-ci -p 12000:12000 \
            -e NODE_ENV=production -e WHYSO_DEMO=1 -e APP_URL=http://localhost:12000 \
            whyso:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:12000/readyz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:12000/readyz
          curl -fsS -X POST http://localhost:12000/api/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"aarav@whyso.dev","password":"demo1234"}' | head -c 200
          docker rm -f whyso-ci
