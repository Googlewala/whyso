<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whyso — UPI expenses, splits & statements</title>
<meta name="description" content="Whyso is a UPI-aware expense manager: scan any UPI QR, split bills with groups, plan occasions and export PDF statements.">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%234f46e5'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E2%82%B9%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="auth-root" class="auth-root" style="display:none"></div>
<div class="app" id="app-shell" style="display:none">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">₹</div>
      <div>
        <div class="brand-name">Whyso</div>
        <div class="brand-tag">UPI expense manager</div>
      </div>
    </div>
    <div class="nav-group">Money</div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <button class="user-chip" id="account-btn" type="button" aria-haspopup="menu">
        <div class="avatar" id="user-avatar">—</div>
        <div class="who">
          <div class="nm" id="user-name">Loading…</div>
          <div class="vp" id="user-vpa">—</div>
        </div>
        <span class="chev">⌄</span>
      </button>
      <div class="account-menu" id="account-menu" role="menu"></div>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1 class="page-title" id="page-title">Dashboard</h1>
        <div class="page-sub" id="page-sub">Your money at a glance</div>
      </div>
      <div class="topbar-actions" id="page-actions"></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="modal-root"></div>
<div class="toast-wrap" id="toasts"></div>
<script src="/vendor/jsQR.js"></script>
<script src="/js/app.js" type="module"></script>
</body>
</html>
